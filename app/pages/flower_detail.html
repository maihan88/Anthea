<!doctype html>
<!-- Chi tiết một loài hoa (/flowers/<id>). Dữ liệu từ GET /api/flowers/<id> (flower_detail.js). Người phụ trách: Nghi -->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loài hoa · Anthea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
</head>
<body>
  <!-- ============ HEADER ============ -->
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">
        <img class="brand-logo" src="/static/img/logo.png" alt="">
        <span class="brand-name">Anthea</span>
      </a>
      <nav class="main-nav">
        <a href="/">Trang chủ</a>
        <a href="/identify">Nhận diện</a>
        <a href="/flowers" class="active">Thư viện hoa</a>
        <a href="/history">Lịch sử</a>
        <a href="/model">Mô hình</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="wrap d-flex flex-column" style="padding-top:30px;padding-bottom:80px;gap:16px">
      <a class="back-link" href="/flowers">← Tất cả loài hoa</a>
      <div id="loadStatus" class="muted">Đang tải thông tin loài hoa…</div>
      <div id="loadError" class="upload-error load-error d-none"><span class="notice-icon">!</span><span id="loadErrorText"></span></div>

      <div id="detail" class="row g-4 g-lg-5 align-items-start d-none">
        <div class="col-lg-6">
          <!-- 3 ô ảnh mẫu (flower_detail.js điền vào) -->
          <div id="gallery" class="detail-gallery"></div>
        </div>
        <div class="col-lg-6 d-flex flex-column" style="gap:26px">
          <div class="d-flex flex-column gap-2">
            <div class="d-flex align-items-center gap-2">
              <span id="dot" class="dot" style="width:10px;height:10px"></span>
              <span id="sci" class="detail-sci"></span>
            </div>
            <h1 id="nameVi" class="detail-title"></h1>
            <div id="nameEn" class="detail-en"></div>
          </div>
          <dl class="info-rows">
            <div><dt>Đặc điểm nhận biết</dt><dd id="desc"></dd></div>
            <div><dt>Ý nghĩa</dt><dd id="meaning"></dd></div>
            <div><dt>Mùa ra hoa</dt><dd id="season"></dd></div>
            <div><dt>Dữ liệu huấn luyện</dt><dd id="dataCount" class="mono" style="font-size:14px"></dd></div>
          </dl>
          <a id="btnIdentify" class="btn btn-forest align-self-start" href="/identify"></a>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <div class="wrap">
      <span><em>Anthea</em> — nhận diện hoa bằng CNN</span>
      <!-- <span class="mono" style="font-size:12px">TensorFlow · Keras · Flask · MySQL</span> -->
    </div>
  </footer>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/flower_detail.js"></script>
</body>
</html>
