{# Hộp xác nhận xóa dùng chung (Bootstrap modal). Trang nào cần thì include trong block after_main;
   confirmDialog() trong api.js điền tiêu đề, nội dung rồi mở. Người phụ trách: Nghi #}
  <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:440px">
      <div class="modal-content anthea-modal">
        <h2 id="confirmTitle">Xóa mục này?</h2>
        <p id="confirmText"></p>
        <div class="d-flex justify-content-end flex-wrap gap-2 mt-4">
          <button type="button" class="btn btn-line" data-bs-dismiss="modal">Hủy</button>
          <button id="btnConfirm" type="button" class="btn btn-danger-anthea">Xóa</button>
        </div>
      </div>
    </div>
  </div>
